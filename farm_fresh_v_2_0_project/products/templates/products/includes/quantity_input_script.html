<script type="text/javascript">
  (function () {
    function handleEnableDisable(itemId) {
      const qtyInputs = document.querySelectorAll(`.input-group-${itemId} input[name="quantity"]`);

      if (!qtyInputs.length) {
        return;
      }

      const currentValue = parseInt(qtyInputs[0].value, 10);
      const minusDisabled = currentValue < 2;
      const plusDisabled = currentValue > 98;

      document.querySelectorAll(`.decrement-qty_${itemId}`).forEach(function (button) {
        button.disabled = minusDisabled;
      });

      document.querySelectorAll(`.increment-qty_${itemId}`).forEach(function (button) {
        button.disabled = plusDisabled;
      });
    }

    document.querySelectorAll(".qty_input").forEach(function (input) {
      const itemId = input.dataset.itemId;

      handleEnableDisable(itemId);

      input.addEventListener("change", function () {
        handleEnableDisable(itemId);
      });
    });

    document.querySelectorAll(".increment-qty").forEach(function (button) {
      button.addEventListener("click", function (e) {
        e.preventDefault();

        const itemId = button.dataset.itemId;
        const quantityInputs = document.querySelectorAll(`.input-group-${itemId} input[name="quantity"]`);

        if (!quantityInputs.length) {
          return;
        }

        const currentValue = parseInt(quantityInputs[0].value, 10);
        const nextValue = Math.min(currentValue + 1, 99);

        quantityInputs.forEach(function (input) {
          input.value = nextValue;
        });

        handleEnableDisable(itemId);
      });
    });

    document.querySelectorAll(".decrement-qty").forEach(function (button) {
      button.addEventListener("click", function (e) {
        e.preventDefault();

        const itemId = button.dataset.itemId;
        const quantityInputs = document.querySelectorAll(`.input-group-${itemId} input[name="quantity"]`);

        if (!quantityInputs.length) {
          return;
        }

        const currentValue = parseInt(quantityInputs[0].value, 10);
        const nextValue = Math.max(currentValue - 1, 1);

        quantityInputs.forEach(function (input) {
          input.value = nextValue;
        });

        handleEnableDisable(itemId);
      });
    });
  })();
</script>
